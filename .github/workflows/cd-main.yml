name: CD — Release (main)

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "admin-panel/**"
      - ".github/workflows/cd-main.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза (например: 1.1.1)"
        required: true
        default: "1.1.1"
      prerelease:
        description: "Пре-релиз?"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CD_ARTIFACT_RETENTION_DAYS: 45

jobs:
  # ═══════════════════════════════════════════════
  #  FRONTEND — сборка Tauri под Windows и Linux
  # ═══════════════════════════════════════════════
  frontend-build-exe:
    name: ⚛️ Frontend — Build Tauri (${{ matrix.os-name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: Windows
            artifact-path: |
              frontend/src-tauri/target/release/bundle/msi/*.msi
              frontend/src-tauri/target/release/bundle/nsis/*.exe
            artifact-name: frontend-windows
          - os: ubuntu-latest
            os-name: Linux
            artifact-path: |
              frontend/src-tauri/target/release/bundle/deb/*.deb
              frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            artifact-name: frontend-linux

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure timetable.db exists for Tauri build
        run: node -e "const fs=require('fs'); const p='src-tauri/timetable.db'; if(!fs.existsSync(p)) fs.writeFileSync(p,'');"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./frontend/src-tauri -> target"
          shared-key: cd-frontend-tauri-${{ matrix.os }}
          cache-on-failure: true

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.FRONTEND_TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.FRONTEND_TAURI_KEY_PASSWORD }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}-${{ github.sha }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: ${{ env.CD_ARTIFACT_RETENTION_DAYS }}

  # ═══════════════════════════════════════════════
  #  ADMIN PANEL — сборка Tauri под Windows и Linux
  # ═══════════════════════════════════════════════
  admin-build-exe:
    name: 🖥️ Admin Panel — Build Tauri (${{ matrix.os-name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: Windows
            artifact-path: |
              admin-panel/src-tauri/target/release/bundle/msi/*.msi
              admin-panel/src-tauri/target/release/bundle/nsis/*.exe
            artifact-name: admin-windows
          - os: ubuntu-latest
            os-name: Linux
            artifact-path: |
              admin-panel/src-tauri/target/release/bundle/deb/*.deb
              admin-panel/src-tauri/target/release/bundle/appimage/*.AppImage
            artifact-name: admin-linux

    defaults:
      run:
        working-directory: admin-panel

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: admin-panel/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./admin-panel/src-tauri -> target"
          shared-key: cd-admin-panel-tauri-${{ matrix.os }}
          cache-on-failure: true

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.ADMIN_TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.ADMIN_TAURI_KEY_PASSWORD }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}-${{ github.sha }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: ${{ env.CD_ARTIFACT_RETENTION_DAYS }}

  # ═══════════════════════════════════════════════
  #  RELEASE — создаём GitHub Release (версия из package.json)
  # ═══════════════════════════════════════════════
  release:
    name: 🚀 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [frontend-build-exe, admin-build-exe]
    if: always() && (needs.frontend-build-exe.result == 'success' || needs.admin-build-exe.result == 'success')

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Determine version and tag
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "tag=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "name=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "prerelease=${{ github.event.inputs.prerelease }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./frontend/package.json').version")
            echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
            echo "name=v${VERSION}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare release metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "commit_message=Manual workflow dispatch" >> $GITHUB_OUTPUT
            echo "commit_timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          else
            echo "commit_message=${{ github.event.head_commit.message }}" >> $GITHUB_OUTPUT
            echo "commit_timestamp=${{ github.event.head_commit.timestamp }}" >> $GITHUB_OUTPUT
          fi

      - name: Get release drafter notes
        id: release_notes
        uses: actions/github-script@v9
        with:
          script: |
            const targetTag = '${{ steps.version.outputs.tag }}';
            const { data } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 30,
            });

            const draft = data.find((r) => r.draft && r.tag_name === targetTag);
            const body = draft?.body?.trim() || '';
            core.setOutput('body', body);

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          body: ${{ steps.release_notes.outputs.body || format('## Релиз {0}\n\n**Коммит:** {1}\n**Дата:** {2}\n**Сообщение:** {3}\n\n### Содержимое:\n- Admin Panel — Windows (.exe, .msi) и Linux (.deb, .AppImage)\n- Frontend — Windows (.exe, .msi) и Linux (.deb, .AppImage)\n- API встроен в Frontend (Rust)', steps.version.outputs.name, github.sha, steps.meta.outputs.commit_timestamp, steps.meta.outputs.commit_message) }}
          files: |
            release-assets/**/*.exe
            release-assets/**/*.msi
            release-assets/**/*.deb
            release-assets/**/*.AppImage
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
