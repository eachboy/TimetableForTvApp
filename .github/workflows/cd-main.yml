name: CD — Release (main)

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "admin-panel/**"
      - "shared/**"
      - ".github/workflows/cd-main.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза (например: 1.1.1)"
        required: true
        default: "1.1.1"
      prerelease:
        description: "Пре-релиз?"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

# Релиз нельзя обрывать на середине — новые запуски ждут в очереди.
concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CD_ARTIFACT_RETENTION_DAYS: 45

jobs:
  # ═══════════════════════════════════════════════
  #  FRONTEND — сборка Tauri под Windows и Linux
  # ═══════════════════════════════════════════════
  frontend-build-exe:
    name: ⚛️ Frontend — Build Tauri (${{ matrix.os-name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: Windows
            artifact-path: |
              frontend/src-tauri/target/release/bundle/msi/*.msi
              frontend/src-tauri/target/release/bundle/msi/*.msi.sig
              frontend/src-tauri/target/release/bundle/nsis/*.exe
            artifact-name: frontend-windows
          - os: ubuntu-latest
            os-name: Linux
            artifact-path: |
              frontend/src-tauri/target/release/bundle/deb/*.deb
              frontend/src-tauri/target/release/bundle/appimage/*.AppImage
              frontend/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            artifact-name: frontend-linux

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure timetable.db exists for Tauri build
        run: node -e "const fs=require('fs'); const p='src-tauri/timetable.db'; if(!fs.existsSync(p)) fs.writeFileSync(p,'');"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Verify version consistency
        run: node ../scripts/check-versions.mjs .

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./frontend/src-tauri -> target"
          shared-key: cd-frontend-tauri-${{ matrix.os }}
          cache-on-failure: true

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev

      - name: Install Node dependencies
        run: npm ci

      # createUpdaterArtifacts=true в tauri.conf.json → без приватного ключа сборка упадёт (так и задумано:
      # неподписанный релиз TV-приложения не сможет обновиться по сети).
      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.FRONTEND_TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.FRONTEND_TAURI_KEY_PASSWORD }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}-${{ github.sha }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: ${{ env.CD_ARTIFACT_RETENTION_DAYS }}

  # ═══════════════════════════════════════════════
  #  ADMIN PANEL — сборка Tauri под Windows и Linux
  # ═══════════════════════════════════════════════
  admin-build-exe:
    name: 🖥️ Admin Panel — Build Tauri (${{ matrix.os-name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: Windows
            artifact-path: |
              admin-panel/src-tauri/target/release/bundle/msi/*.msi
              admin-panel/src-tauri/target/release/bundle/nsis/*.exe
            artifact-name: admin-windows
          - os: ubuntu-latest
            os-name: Linux
            artifact-path: |
              admin-panel/src-tauri/target/release/bundle/deb/*.deb
              admin-panel/src-tauri/target/release/bundle/appimage/*.AppImage
            artifact-name: admin-linux

    defaults:
      run:
        working-directory: admin-panel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: admin-panel/package-lock.json

      - name: Verify version consistency
        run: node ../scripts/check-versions.mjs .

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./admin-panel/src-tauri -> target"
          shared-key: cd-admin-panel-tauri-${{ matrix.os }}
          cache-on-failure: true

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}-${{ github.sha }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: ${{ env.CD_ARTIFACT_RETENTION_DAYS }}

  # ═══════════════════════════════════════════════
  #  RELEASE — создаём GitHub Release (версия из frontend/package.json)
  # ═══════════════════════════════════════════════
  release:
    name: 🚀 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [frontend-build-exe, admin-build-exe]
    # Релиз нужен только если собрался Frontend: именно его .msi/.AppImage + .sig
    # админка раздаёт по сети как автообновление TV.
    if: always() && needs.frontend-build-exe.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Determine version and tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            PRERELEASE="$INPUT_PRERELEASE"
          else
            VERSION=$(node -p "require('./frontend/package.json').version")
            PRERELEASE=false
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Некорректная версия: '$VERSION'"
            exit 1
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      # Автообновление сравнивает версии: уже выпущенный тег перезаписывать нельзя.
      # Пуш в main без повышения версии не должен пересоздавать релиз.
      - name: Check that the release does not exist yet
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::warning::Релиз $TAG уже существует — пропускаю. Поднимите версию: node scripts/bump-version.mjs"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get release drafter notes
        if: steps.exists.outputs.skip != 'true'
        id: release_notes
        uses: actions/github-script@v7
        env:
          TARGET_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const { data } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 30,
            });
            const draft = data.find((r) => r.draft && r.tag_name === process.env.TARGET_TAG);
            core.setOutput('body', draft?.body?.trim() || '');

      # Frontend (TV): всё, включая .sig — по ним админка собирает latest.json для автообновления.
      # Admin Panel: только .exe/.deb. Её .msi/.AppImage НЕ загружаем, иначе админка перепутает
      # их с установщиком TV (update_server берёт первый найденный *.msi / *.AppImage).
      - name: Create GitHub Release
        if: steps.exists.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: ${{ steps.release_notes.outputs.body == '' }}
          body: ${{ steps.release_notes.outputs.body }}
          files: |
            release-assets/frontend-*/**/*.msi
            release-assets/frontend-*/**/*.msi.sig
            release-assets/frontend-*/**/*.exe
            release-assets/frontend-*/**/*.deb
            release-assets/frontend-*/**/*.AppImage
            release-assets/frontend-*/**/*.AppImage.sig
            release-assets/admin-*/**/*.exe
            release-assets/admin-*/**/*.deb
          fail_on_unmatched_files: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
