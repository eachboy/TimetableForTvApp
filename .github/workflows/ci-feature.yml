name: CI — Feature Branches

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - develop
  pull_request:
    branches:
      - develop
      - main

jobs:
  # ═══════════════════════════════════════════════
  #  FRONTEND — Next.js + Tauri (unit tests + Rust tests + build)
  # ═══════════════════════════════════════════════
  frontend-test:
    name: ⚛️ Frontend — Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint || echo "⚠️ No lint script, skipping"

      - name: Unit tests
        run: npm test

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure timetable.db exists for Tauri build
        run: |
          if [ ! -f src-tauri/timetable.db ]; then
            touch src-tauri/timetable.db
          fi

      - name: Rust tests
        run: cd src-tauri && cargo test

      - name: Build Next.js
        run: npm run build

  # ═══════════════════════════════════════════════
  #  ADMIN PANEL — Next.js + Tauri (unit tests + build)
  # ═══════════════════════════════════════════════
  admin-test:
    name: 🖥️ Admin Panel — Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: admin-panel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build frontend assets
        run: npm run build
