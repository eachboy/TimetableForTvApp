name: CI — Feature Branches

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - develop
    paths:
      - "frontend/**"
      - "admin-panel/**"
      - ".github/workflows/ci-feature.yml"
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "frontend/**"
      - "admin-panel/**"
      - ".github/workflows/ci-feature.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_ARTIFACT_RETENTION_DAYS: 7

jobs:
  # ═══════════════════════════════════════════════
  #  FRONTEND — Next.js + Tauri (unit tests + Rust tests + build)
  # ═══════════════════════════════════════════════
  frontend-test:
    name: ⚛️ Frontend — Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests
        run: npm test -- --passWithNoTests

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache (frontend)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./frontend/src-tauri -> target"
          shared-key: ci-frontend-tauri
          cache-on-failure: true

      - name: Install Linux dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev

      - name: Ensure timetable.db exists for Tauri build
        run: |
          if [ ! -f src-tauri/timetable.db ]; then
            touch src-tauri/timetable.db
          fi

      - name: Rust check
        run: cd src-tauri && cargo check

      - name: Build Next.js
        run: npm run build

      - name: Upload frontend build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-ci-build-metadata-${{ github.sha }}
          path: |
            frontend/.next/build-manifest.json
            frontend/.next/prerender-manifest.json
          if-no-files-found: ignore
          retention-days: ${{ env.CI_ARTIFACT_RETENTION_DAYS }}

  # ═══════════════════════════════════════════════
  #  ADMIN PANEL — Next.js + Tauri (unit tests + build)
  # ═══════════════════════════════════════════════
  admin-test:
    name: 🖥️ Admin Panel — Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: admin-panel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --passWithNoTests

      - name: Lint
        run: npm run lint --if-present

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache (admin-panel)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./admin-panel/src-tauri -> target"
          shared-key: ci-admin-panel-tauri
          cache-on-failure: true

      - name: Install Linux dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev

      - name: Rust check
        run: cd src-tauri && cargo check

      - name: Build frontend assets
        run: npm run build

      - name: Upload admin-panel build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-panel-ci-build-metadata-${{ github.sha }}
          path: |
            admin-panel/.next/build-manifest.json
            admin-panel/.next/prerender-manifest.json
          if-no-files-found: ignore
          retention-days: ${{ env.CI_ARTIFACT_RETENTION_DAYS }}
