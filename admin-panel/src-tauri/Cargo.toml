[package]
name = "Timetable_Control_Panel"
version = "1.3.1"
description = "Timetable"
authors = ["eachboy"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"

# Для работы с датой/временем (погода)
chrono = { version = "0.4", features = ["clock"] }

# HTTP клиент для запросов к GitHub API
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# mDNS для объявления себя в локальной сети
mdns-sd = "0.11"

# Лёгкий HTTP сервер для раздачи обновлений
tiny_http = "0.12"

# Для работы с путями и файлами
dirs = "5"
local-ip-address = "0.6.10"

# Защищённый канал TV <-> admin-panel (см. ../shared/secure_channel.rs)
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
tempfile = "3.14"
