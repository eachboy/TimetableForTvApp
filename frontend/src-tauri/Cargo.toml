[package]
name = "Timetable"
version = "1.3.3"
description = "eachboy"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "Timetable"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "api-server"
path = "src/bin/api_server_main.rs"
required-features = []

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2.3.5"

# Updater plugin
tauri-plugin-updater = "2"

# Autostart on system boot
tauri-plugin-autostart = "2"

# url::Url используется в lib.rs для парсинга endpoint-а
url = "2"

# mDNS для поиска Admin Panel в локальной сети
mdns-sd = "0.11"

# HTTP клиент
reqwest = { version = "0.12", features = ["json", "blocking"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# SQLite для локальной БД (вместо Python-бэкенда)
rusqlite = { version = "0.32", features = ["bundled"] }
lazy_static = "1.4"
chrono = "0.4"

# HTTP API (полный аналог Python-бэкенда для admin panel)
axum = { version = "0.7", features = ["json", "multipart"] }
env_logger = "0.11"
jsonwebtoken = "9"
bcrypt = "0.16"
sysinfo = "0.31"
local-ip-address = "0.6.10"

# Защищённый канал TV <-> admin-panel (см. ../shared/secure_channel.rs)
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
tempfile = "3.14"
